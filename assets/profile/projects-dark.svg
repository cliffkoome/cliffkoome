<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-label="Selected work: MatConnect, InstaScreen, typeghast">
<title>Selected work: MatConnect, InstaScreen, typeghast</title>
<defs>
<linearGradient id="g-projects" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
</defs>
<style>
.m { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
.s { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.lab { font-family: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 2.5px; fill: #7d8a9c; }
.up { animation: up .9s cubic-bezier(.2,.7,.2,1) backwards; }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes blink { 50% { opacity: .25; } }
.trace { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
