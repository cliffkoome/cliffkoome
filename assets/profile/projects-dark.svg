</style>
<rect x="0.5" y="0.5" width="859" height="409" rx="14" fill="#0a0e16" stroke="#1e2a3a"/>
<text x="48" y="38" class="lab" text-anchor="start">SELECTED WORK / PROJECT CONSTELLATION</text><line class="trace" x1="64" y1="86" x2="64" y2="278" stroke="#3a4658" stroke-width="1.5"/><g class="up" style="animation-delay:0.15s"><circle cx="64" cy="86" r="7" fill="#0a0e16" stroke="#3178c6" stroke-width="2"/><circle cx="64" cy="86" r="3" fill="#3178c6" class="node" style="animation-delay:0.0s"/><rect x="92" y="60" width="720" height="80" rx="10" fill="#0f1520" stroke="#1e2a3a"/><text x="112" y="90" class="s" font-size="17" font-weight="650" fill="#e6edf3">MatConnect</text><text x="792" y="90" class="m" font-size="11" text-anchor="end" fill="#7d8a9c">updated Nov 2026</text><text x="112" y="112" class="s" font-size="12.5" fill="#7d8a9c">Live GPS kept apart from the Postgres system of record; a leased ETA job safe on VM, cron or many instances.</text><text x="112" y="130" class="m" font-size="11" fill="#2dd4bf">TypeScript   ·   #better-auth  #eta  #firebase</text></g><g class="up" style="animation-delay:0.35s"><circle cx="64" cy="182" r="7" fill="#0a0e16" stroke="#f34b7d" stroke-width="2"/><circle cx="64" cy="182" r="3" fill="#f34b7d" class="node" style="animation-delay:0.6s"/><rect x="92" y="156" width="720" height="80" rx="10" fill="#0f1520" stroke="#1e2a3a"/><text x="112" y="186" class="s" font-size="17" font-weight="650" fill="#e6edf3">InstaScreen</text><text x="792" y="186" class="m" font-size="11" text-anchor="end" fill="#7d8a9c">updated Nov 2026</text><text x="112" y="208" class="s" font-size="12.5" fill="#7d8a9c">Checksummed wire format chunked through Firebase to fit ~320 KB of SRAM; ETag compare-and-set, no backend.</text><text x="112" y="226" class="m" font-size="11" fill="#2dd4bf">C++   ·   #arduino  #cli  #embedded-cpp</text></g><g class="up" style="animation-delay:0.55s"><circle cx="64" cy="278" r="7" fill="#0a0e16" stroke="#00ADD8" stroke-width="2"/><circle cx="64" cy="278" r="3" fill="#00ADD8" class="node" style="animation-delay:1.2s"/><rect x="92" y="252" width="720" height="80" rx="10" fill="#0f1520" stroke="#1e2a3a"/><text x="112" y="282" class="s" font-size="17" font-weight="650" fill="#e6edf3">typeghast</text><text x="792" y="282" class="m" font-size="11" text-anchor="end" fill="#7d8a9c">updated Oct 2026</text><text x="112" y="304" class="s" font-size="12.5" fill="#7d8a9c">Tails coding-agent logs live; a local Gemma model writes the text to type. Nothing leaves the machine.</text><text x="112" y="322" class="m" font-size="11" fill="#2dd4bf">Go   ·   #bubbletea  #coding-agents  #context-window</text></g><text x="812" y="384" class="m" font-size="11" text-anchor="end" fill="#7d8a9c">architecture notes and ADRs in each repo →</text>
</svg>
