<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170" role="img" aria-label="Current focus: Devices to cloud: Hardware, phones and cloud services that agree on what&#x27;s true.; Built for failure: Dropped networks and duplicate events are the normal case.; Decisions on record: Trade-offs written down as ADRs, with a scaling plan.">
